# Netlify build config. The official Next.js plugin is auto-installed by
# Netlify and handles SSR/SSG, the dynamic OG-image route and image
# optimization — no code changes needed.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers (mirrors next.config.ts for routes served by the CDN).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
